[project]
name = "workmate"
version = "1.3.0"
description = "Wewnętrzny serwer MCP pionu Inteligentnych Technologii — wspólna baza wiedzy (notatki, status projektów) dla Claude Code, runtime agenta na drzwiach Teams/CLI, most GitHub ↔ EventStore ↔ Teams (z bramkowanym zapisem), odczyt Jira 'moje zadania' oraz lokalny retrieval leksykalny notatek."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # server.py importuje uvicorn wprost w gałęzi HTTP (streamable-http, ADR 0007);
    # deklarujemy go jawnie, nie polegając na tranzytywności przez mcp[cli].
    "uvicorn>=0.30",
    # ``core/domain/week.py`` liczy granice tygodnia przez ``ZoneInfo`` (ADR 0035). Windows nie ma
    # systemowej bazy stref, więc bez tego pakietu ZoneInfo("Europe/Warsaw") rzuca — na Linuksie
    # (serwer docelowy) baza jest systemowa, stąd marker. Zależność RDZENIA, nie extra: to czysta
    # domena, a jej testy biegają bez extras.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Drzwi Teams (Faza 2) — ciężki Microsoft 365 Agents SDK (następca zarchiwizowanego
# Bot Framework SDK, patrz docs/research/teams-bot-setup-2026.md). Instalacja
# serwera MCP zostaje lekka; Teams doinstalowuje się przez `uv sync --extra teams`.
teams = [
    "microsoft-agents-hosting-aiohttp>=1.1.0",
    "microsoft-agents-hosting-core>=1.1.0",
    "microsoft-agents-activity>=1.1.0",
    "microsoft-agents-authentication-msal>=1.1.0",
]
# Runtime agenta (Faza 2, M1 / ADR 0008) — oficjalny SDK Anthropic. Serwer MCP
# zostaje lekki; runtime doinstalowuje się przez `uv sync --extra agent`.
agent = [
    "anthropic>=0.40",
]
# Drzwi Teams w trybie DELEGOWANYM (ADR 0015) — polling kanału przez Microsoft Graph
# jako zalogowany użytkownik (device-code MSAL). Bez ciężkiego Agents SDK; serwer MCP
# zostaje lekki. Współdziała z extra `agent` (runtime nad tymi samymi narzędziami).
teams-graph = [
    "msal>=1.37.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0",
    # Ekstrakcja tekstu z .docx (Claude API nie przyjmuje Worda natywnie) — ADR 0016.
    "python-docx>=1.1",
    # Render Markdown→HTML odpowiedzi agenta na kanale (contentType html); import leniwy.
    "markdown-it-py>=3.0",
    # Ekstrakcja tekstu z Excela/PowerPointa oraz sniff/downscaling obrazów; import leniwy.
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pillow>=10",
    # Dekoder HEIC/HEIF (domyślny format zdjęć iPhone) — Pillow sam nie czyta HEIF; wtyczka
    # rejestruje opener (register_heif_opener), a materializer konwertuje HEIC→JPEG. Wheel'e
    # pakują libheif — bez systemowej zależności. Import/rejestracja LENIWE w adapterze. ADR 0016.
    "pillow-heif>=0.16",
]
# Drzwi GitHub w trybie DELEGOWANYM (ADR 0020) — polling repo przez GitHub REST tokenem PAT.
# Bez webhooka/publicznego endpointu; serwer MCP zostaje lekki. Współdziała z extra `agent`
# (runtime nad tymi samymi narzędziami) i `teams-graph` (proaktywny push zdarzeń do Teams).
github = [
    "httpx>=0.28.1",
    "python-dotenv>=1.0",
]
# Odczyt Jira "moje zadania" (ADR 0030/0054) — REST v2/v3 tokenem, WYŁĄCZNIE odczyt (bez pollera).
# Serwer MCP zostaje lekki; doinstalowuje się przez `uv sync --extra jira`.
jira = [
    "httpx>=0.28.1",
    "python-dotenv>=1.0",
]
# Lepszy retrieval notatek (ADR 0023, Faza A) — lematyzacja polska (BM25 nad lematami odporny na
# fleksję). Lekkie, pure-Python, bez torch; serwer MCP zostaje lekki. Warstwa dense (osadzenia)
# to Faza B za bramką mikro-evalu — osobny extra dopiero wtedy.
retrieval = [
    "simplemma>=1.0",
]
# Warstwa DENSE retrievalu (ADR 0039, Faza B) — osadzenia semantyczne przez ONNX Runtime
# (fastembed, BEZ torch) + numpy do cosinusa. Cięższa niż `retrieval` (onnxruntime ~+150 MB),
# więc OSOBNY extra, domyślnie NIEinstalowany; import leniwy w adapterze. Wchodzi na produkcję
# TYLKO po przejściu bramki mikro-evalu (eval/retrieval_eval.py, próg z ADR 0039).
retrieval-dense = [
    "fastembed>=0.4",
    "numpy>=1.26",
]
# Odpowiedź agenta PLIKIEM w wątku Teams (ADR 0026, A′2) — renderer PDF (fpdf2 z osadzonym fontem
# Unicode DejaVu). Format `docx` idzie przez python-docx z extra `teams-graph`, a `md`/`txt` to
# czyste bajty bez zależności. OSOBNY extra: zdolność jest bramkowana (enable_file_reply) i
# doinstalowuje się tylko tam, gdzie włączona; import fpdf2 jest leniwy w adapterze.
file-reply = [
    "fpdf2>=2.8",
]
# Seed korpusu (W0) — importer `workmate-seed-corpus` ekstrahuje tekst z dokumentów Office/PDF
# (te same biblioteki co materializer teams-graph, ADR 0016, + pypdf na PDF). OSOBNY extra: to
# narzędzie operatorskie uruchamiane doraźnie, nie musi być w środowisku serwera MCP ani drzwi.
seed = [
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pypdf>=4.0",
]

[project.scripts]
# Komenda uruchamiająca serwer MCP (używana przez `.mcp.json`: `uv run workmate`).
workmate = "workmate.server:main"
# Proces drzwi Teams (Faza 2), osobny od serwera MCP: `uv run workmate-teams`.
workmate-teams = "workmate.adapters.inbound.teams.app:main"
# Lokalny harness runtime'u agenta (Faza 2, M1): `uv run workmate-agent`.
workmate-agent = "workmate.adapters.inbound.cli.app:main"
# Lokalny harness przepływu „notatka ze spotkania" (Faza 2, M3 / ADR 0009): `uv run workmate-meeting`.
workmate-meeting = "workmate.adapters.inbound.cli.meeting:main"
# Proces drzwi Teams w trybie delegowanym (ADR 0015): `uv run workmate-teams-graph`.
workmate-teams-graph = "workmate.adapters.inbound.teams_graph.app:main"
# Proces drzwi GitHub w trybie delegowanym (ADR 0020), polling PAT: `uv run workmate-github`.
workmate-github = "workmate.adapters.inbound.github.app:main"
# Proces proaktywnego digestu zmian (ADR 0053, F6), cotygodniowy: `uv run workmate-teams-digest`.
workmate-teams-digest = "workmate.adapters.inbound.teams_digest.app:main"
# Healthcheck pulsu pollera (R5): sprawdza wiek pliku pulsu na wolumenie stanu. Wołany przez
# compose (`docker compose ps` → healthy/unhealthy), nie ręcznie: `workmate-heartbeat-check --file … --max-age …`.
workmate-heartbeat-check = "workmate.adapters.inbound.heartbeat:main"
# Raport metryk użycia (Tor A): zwija licznik SQLite do tabeli. `workmate-metrics [--db …]`
# (domyślnie WORKMATE_METRICS_DB — ta sama ścieżka, która włącza zbieranie).
workmate-metrics = "workmate.adapters.inbound.metrics_report:main"
# Seed korpusu (W0): importuje lokalne dokumenty (md/txt/docx/xlsx/pptx/pdf) do notatek. Domyślnie
# dry-run; zapis dopiero z `--write` (extra `seed`, ekstrakcja Office/PDF). `workmate-seed-corpus
# --source <dir> --project <klucz> [--write]`.
workmate-seed-corpus = "workmate.adapters.inbound.seed_corpus:main"

# Narzędzia deweloperskie (PEP 735) — nie trafiają do dystrybucji.
# Instalacja: `uv sync` (grupa `dev` jest domyślnie włączana przez uv).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-testmon>=2.1",   # bieg inkrementalny: tylko testy dotknięte zmianą (`--testmon`)
    "pytest-xdist>=3.5",     # zrównoleglenie pełnego pakietu (`-n auto`)
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workmate"]
# Zasoby NIE-Pythonowe (osadzony font Unicode do renderowania PDF, ADR 0026) MUSZĄ trafić do wheela.
# Jawny `artifacts` gwarantuje spakowanie niezależnie od domyślnej selekcji plików build-backendu.
artifacts = ["src/workmate/adapters/outbound/assets/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
warn_unused_configs = true

# Serwer MCP/FastMCP bywa różnie otypowany między wersjami — nie wywracaj typów
# przez brak stubów zależności zewnętrznej.
[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

# Agents SDK i aiohttp są opcjonalne (extra `teams`) — bez zainstalowanego extra
# mypy serwera MCP nie może się o nie wywrócić. Importy są i tak leniwe.
[[tool.mypy.overrides]]
module = ["microsoft_agents.*", "aiohttp.*"]
ignore_missing_imports = true

# Anthropic SDK jest opcjonalny (extra `agent`, ADR 0008) — import leniwy w
# adapterze outbound, więc mypy rdzenia nie może się o niego wywrócić.
[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true


# Załączniki drzwi teams_graph (extra `teams-graph`, ADR 0016) — python-docx, openpyxl,
# python-pptx, Pillow i pillow-heif importowane leniwie w adapterze; mypy rdzenia nie może się o nie wywrócić.
[[tool.mypy.overrides]]
module = ["docx.*", "openpyxl.*", "pptx.*", "PIL.*", "pillow_heif.*", "pypdf.*"]
ignore_missing_imports = true

# simplemma (extra `retrieval`, ADR 0023) — bez stubów; import LENIWY w wiringu, więc mypy
# rdzenia nie może się o niego wywrócić.
[[tool.mypy.overrides]]
module = ["simplemma.*"]
ignore_missing_imports = true

# fastembed + numpy (extra `retrieval-dense`, ADR 0039) — import LENIWY w adapterze outbound,
# więc mypy rdzenia nie może się o nie wywrócić.
[[tool.mypy.overrides]]
module = ["fastembed.*", "numpy.*"]
ignore_missing_imports = true

# fpdf2 (extra `file-reply`, ADR 0026) — renderer PDF; import LENIWY w adapterze outbound, więc
# mypy rdzenia nie może się o niego wywrócić (moduł importowy nazywa się `fpdf`).
[[tool.mypy.overrides]]
module = ["fpdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "eval"]
testpaths = ["tests"]
addopts = "-q"

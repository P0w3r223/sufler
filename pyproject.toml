[project]
name = "workmate"
version = "0.1.0"
description = "Wewnętrzny serwer MCP pionu Inteligentnych Technologii — wspólna baza wiedzy (notatki, status projektów) dla Claude Code. Faza 1 domknięta (odczyt + save_note + HTTP); Faza 2 w toku: runtime agenta i drzwi Teams nad tymi samymi narzędziami."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # server.py importuje uvicorn wprost w gałęzi HTTP (streamable-http, ADR 0007);
    # deklarujemy go jawnie, nie polegając na tranzytywności przez mcp[cli].
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Drzwi Teams (Faza 2) — ciężki Microsoft 365 Agents SDK (następca zarchiwizowanego
# Bot Framework SDK, patrz docs/research/teams-bot-setup-2026.md). Instalacja
# serwera MCP zostaje lekka; Teams doinstalowuje się przez `uv sync --extra teams`.
teams = [
    "microsoft-agents-hosting-aiohttp>=1.1.0",
    "microsoft-agents-hosting-core>=1.1.0",
    "microsoft-agents-activity>=1.1.0",
    "microsoft-agents-authentication-msal>=1.1.0",
]
# Runtime agenta (Faza 2, M1 / ADR 0008) — oficjalny SDK Anthropic. Serwer MCP
# zostaje lekki; runtime doinstalowuje się przez `uv sync --extra agent`.
agent = [
    "anthropic>=0.40",
]
# Drzwi Telegram (Faza 2, spike echo) — python-telegram-bot (long polling) +
# python-dotenv do wczytania .env. Serwer MCP zostaje lekki.
telegram = [
    "python-telegram-bot>=21",
    "python-dotenv>=1.0",
]
# Drzwi Teams w trybie DELEGOWANYM (ADR 0015) — polling kanału przez Microsoft Graph
# jako zalogowany użytkownik (device-code MSAL). Bez ciężkiego Agents SDK; serwer MCP
# zostaje lekki. Współdziała z extra `agent` (runtime nad tymi samymi narzędziami).
teams-graph = [
    "msal>=1.37.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0",
]

[project.scripts]
# Komenda uruchamiająca serwer MCP (używana przez `.mcp.json`: `uv run workmate`).
workmate = "workmate.server:main"
# Proces drzwi Teams (Faza 2), osobny od serwera MCP: `uv run workmate-teams`.
workmate-teams = "workmate.adapters.inbound.teams.app:main"
# Lokalny harness runtime'u agenta (Faza 2, M1): `uv run workmate-agent`.
workmate-agent = "workmate.adapters.inbound.cli.app:main"
# Proces drzwi Telegram (Faza 2), long polling: `uv run workmate-telegram`.
workmate-telegram = "workmate.adapters.inbound.telegram.app:main"
# Proces drzwi Teams w trybie delegowanym (ADR 0015): `uv run workmate-teams-graph`.
workmate-teams-graph = "workmate.adapters.inbound.teams_graph.app:main"

# Narzędzia deweloperskie (PEP 735) — nie trafiają do dystrybucji.
# Instalacja: `uv sync` (grupa `dev` jest domyślnie włączana przez uv).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workmate"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
warn_unused_configs = true

# Serwer MCP/FastMCP bywa różnie otypowany między wersjami — nie wywracaj typów
# przez brak stubów zależności zewnętrznej.
[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

# Agents SDK i aiohttp są opcjonalne (extra `teams`) — bez zainstalowanego extra
# mypy serwera MCP nie może się o nie wywrócić. Importy są i tak leniwe.
[[tool.mypy.overrides]]
module = ["microsoft_agents.*", "aiohttp.*"]
ignore_missing_imports = true

# Anthropic SDK jest opcjonalny (extra `agent`, ADR 0008) — import leniwy w
# adapterze outbound, więc mypy rdzenia nie może się o niego wywrócić.
[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true

# Telegram (python-telegram-bot) i python-dotenv są opcjonalne (extra `telegram`) —
# importy leniwe, więc mypy rdzenia nie może się o nie wywrócić.
[[tool.mypy.overrides]]
module = ["telegram.*", "dotenv.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

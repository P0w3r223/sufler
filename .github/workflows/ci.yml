name: CI

on:
  push:
    branches: [Main, Dev]
  pull_request:
    branches: [Main, Dev]
  # Bieg NOCNY. Bez niego bramka pada dopiero przy następnym pushu, a bywa, że nikt nic nie
  # zepsuł: #88 stało czerwone JEDENAŚCIE DNI, bo wygasła cena wprowadzająca
  # (`PRICING_SWITCH_DATE`) — kod się nie zmienił, zmienił się kalendarz. Przez ten czas nie dało
  # się zbudować obrazu floty, bo Dockerfile odpala `pytest && touch /app/.tests-passed`.
  # Druga instancja tej klasy (zegar systemowy w oknie wysyłki `Powiadomienia_teams`) wracała
  # w KAŻDY weekend. Bieg raz na dobę zamienia oba przypadki z „wyjdzie przy następnym wydaniu"
  # na „wiadomo następnego ranka".
  #
  # 04:17 UTC = 06:17 czasu warszawskiego: po północy UTC (zmiana doby zdążyła zajść) i przed
  # początkiem pracy zespołu. Minuta nie jest okrągła świadomie — o pełnych godzinach kolejka
  # GitHuba jest najdłuższa i biegi potrafią się opóźnić o kilkadziesiąt minut.
  #
  # GitHub odpala `schedule` WYŁĄCZNIE z gałęzi domyślnej (tu: `Main`), czyli dokładnie z tej,
  # z której budowany jest obraz — to jest ta gałąź, o którą chodzi.
  schedule:
    - cron: "17 4 * * *"
  # Ręczne uruchomienie: pozwala sprawdzić poprawkę bomby kalendarzowej bez czekania do rana
  # i bez pustego commita.
  workflow_dispatch:

# Kolejny push na tę samą gałąź unieważnia poprzedni przebieg — ale TYLKO na PR-ze. Na `Main`,
# w biegu nocnym i przy `workflow_dispatch` anulowanie byłoby stratą dowodu: to są jedyne
# przebiegi, na które powołuje się historia (badge, bomba kalendarzowa, bramka autorstwa
# łapiąca autora nadanego przez przycisk scalenia — ten commit istnieje wyłącznie na `Main`).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Zakres zmian liczony RAZ, żeby kosztowne zadania nie biegały na zmianach, których nie
  # dotyczą. Świadomie bez akcji zewnętrznej (`paths-filter`): ten workflow używa dziś trzech
  # akcji i każda kolejna to kolejny dostawca w łańcuchu bramki, która ma być dowodem.
  #
  # Zawężamy WYŁĄCZNIE na `pull_request`. Na `Main`, nocą i ręcznie biegnie komplet — bo to są
  # przebiegi, które mają odpowiadać na pytanie „czy drzewo jest zdrowe", a nie „czy ta zmiana
  # jest bezpieczna". Bieg nocny bez budowy obrazów przestałby rozbrajać bombę kalendarzową,
  # czyli dokładnie to, po co powstał.
  zmiany:
    name: Zakres zmian
    runs-on: ubuntu-latest
    outputs:
      podprojekty: ${{ steps.filtr.outputs.podprojekty }}
      obraz_floty: ${{ steps.filtr.outputs.obraz_floty }}
      obraz_powiadomien: ${{ steps.filtr.outputs.obraz_powiadomien }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Potrzebny merge-base, a domyślny checkout jest płytki — bez tego `git diff` nie ma
          # z czym porównać i zawężenie wypisałoby pustkę, czyli ciszę zamiast bramki.
          fetch-depth: 0

      - name: Policz, czego dotyczy zmiana
        id: filtr
        env:
          BAZA: ${{ github.event.pull_request.base.sha }}
          GLOWA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Poza `pull_request` nie zawężamy niczego. `ALL` jest sentynelem, nie pustym napisem:
          # pusty napis znaczyłby „żaden pod-projekt nie tknięty", a to zupełnie inna sytuacja.
          if [ -z "${BAZA:-}" ]; then
            printf 'podprojekty=ALL\nobraz_floty=true\nobraz_powiadomien=true\n' >> "$GITHUB_OUTPUT"
            echo "Poza PR-em — komplet bramek."
            exit 0
          fi
          pliki=$(git diff --name-only "$BAZA...$GLOWA")
          echo "Zmienione pliki:"; echo "$pliki" | sed 's/^/  /'

          # Pliki WSPÓLNE cofają zawężenie do zera. To nie ostrożność, tylko zmierzona zależność:
          # `Powiadomienia_teams/tests/test_srodowiska_bramki.py` i `krs-tool/tests/test_bramka_ci.py`
          # CZYTAJĄ ten plik workflow, a `tests/deploy/test_ci_workflow.py` czyta go razem
          # z `CONTRIBUTING.md`. Zmiana w nich zmienia wynik testów pod-projektów, więc
          # pominięcie ich wpisów dałoby zieleń bez pokrycia.
          if echo "$pliki" | grep -qE '^(\.github/workflows/ci\.yml|CONTRIBUTING\.md|pyproject\.toml|uv\.lock|\.python-version)$'; then
            printf 'podprojekty=ALL\nobraz_floty=true\nobraz_powiadomien=true\n' >> "$GITHUB_OUTPUT"
            echo "Zmiana dotyka pliku wspólnego — komplet bramek."
            exit 0
          fi

          lista=""
          echo "$pliki" | grep -q '^Powiadomienia_teams/' && lista="$lista powiadomienia-teams"
          echo "$pliki" | grep -q '^claude_summary/'      && lista="$lista claude-summary"
          echo "$pliki" | grep -q '^ceidg-tool/'          && lista="$lista ceidg-tool"
          echo "$pliki" | grep -q '^krs-tool/'            && lista="$lista krs-tool"
          echo "podprojekty=${lista# }" >> "$GITHUB_OUTPUT"

          # Obraz floty budujemy, gdy zmienia się cokolwiek, co do niego wchodzi. Lista idzie za
          # `COPY` w `deploy/docker/Dockerfile` (src, tests, eval, data, deploy/http) plus sam
          # Dockerfile i manifesty zależności.
          if echo "$pliki" | grep -qE '^(src/|tests/|eval/|data/|deploy/|pyproject\.toml|uv\.lock)'; then
            echo "obraz_floty=true" >> "$GITHUB_OUTPUT"
          else
            echo "obraz_floty=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$pliki" | grep -q '^Powiadomienia_teams/'; then
            echo "obraz_powiadomien=true" >> "$GITHUB_OUTPUT"
          else
            echo "obraz_powiadomien=false" >> "$GITHUB_OUTPUT"
          fi

  quality-gate:
    name: Bramka jakości (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: zmiany
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workmate
            dir: "."
            # `seed` jest tu, bo `tests/adapters/inbound/test_document_text.py` ekstrahuje tekst
            # z PDF — a `pypdf` mieszka w TYM extra, nie w `file-reply` (tam jest sam `fpdf2`,
            # renderer). Bez niego jeden test padał od 2026-07-30, przykrywając wszystkie kroki
            # po sobie: lint, format, mypy i granice nie wykonywały się wcale. Ta sama lista
            # extras co w etapie `test` obrazu (`deploy/docker/Dockerfile`) — jedno źródło prawdy
            # o tym, czego wymaga pełny przebieg testów.
            sync_args: "--extra agent --extra github --extra jira --extra teams-graph --extra retrieval --extra file-reply --extra seed"
            # `deploy` i `scripts` doszły 2026-08-06. Wcześniej lista obejmowała `src tests eval`,
            # więc trzy pliki narzędziowe stały niezgodne z `ruff format` przy ZIELONYM CI —
            # wychodziło to dopiero, gdy ktoś uruchomił `ruff format .` lokalnie i zobaczył
            # w diffie pliki, których nie dotykał. Korzeń wymienia katalogi JAWNIE, a nie `.`,
            # bo podprojekty mają własne wpisy z własnym `dir` — inaczej lintowalibyśmy je
            # dwa razy. Nowy katalog z kodem to nowy wpis na tej liście.
            lint_paths: "src tests eval deploy scripts"
          - name: powiadomienia-teams
            dir: "Powiadomienia_teams"
            # TA SAMA lista extras co etap `test` w `Powiadomienia_teams/Dockerfile` — jedno
            # źródło prawdy o tym, czego wymaga pełny przebieg testów, tak jak we wpisie
            # `workmate` wyżej. Do 2026-09-07 stało tu `""`, więc ten sam zestaw testów biegał
            # w CI i w obrazie w DWÓCH różnych środowiskach; zgodności pilnuje teraz
            # `tests/test_srodowiska_bramki.py`.
            sync_args: "--extra agent"
            lint_paths: "."
          - name: claude-summary
            dir: "claude_summary"
            sync_args: ""
            lint_paths: "."
          - name: ceidg-tool
            dir: "ceidg-tool"
            # `dev` niesie pytest, ruff i mypy: pod-projekt trzyma narzędzia w EXTRASACH, nie
            # w `dependency-groups`, więc `uv sync` bez tego wpisu zainstalowałby sam produkt
            # i każdy krok bramki padłby na braku polecenia. `asystent` jest obowiązkowy mimo
            # że asystent językowy jest w produkcie opcjonalny — bez niego
            # `tests/test_assistant_caller.py` nie ZBIERA się (importuje `httpx2`), a przebieg,
            # w którym część suity się nie zebrała, jest zielony z powodu, którego nikt nie chciał.
            sync_args: "--extra dev --extra asystent"
            # Ten pod-projekt ma układ płaski (pakiet w korzeniu, bez `src/`), stąd nazwy
            # katalogów zamiast `.`: `.` wciągnęłoby dostarczony oryginał `ceidg_probe.py`,
            # świadomie trzymany poza regułami (`extend-exclude` w jego `pyproject.toml`).
            lint_paths: "ceidg_tool tests scripts"
          - name: krs-tool
            dir: "krs-tool"
            # Piąty najemca (ceidg-tool/docs/adr/0023). Bez `--extra dev` `uv sync` postawiłby
            # sam produkt i każdy krok bramki padłby na braku polecenia — tak samo jak wyżej.
            # Żadnej ekstry poza `dev` tu nie ma i nie ma jej z powodu: ten pod-projekt nie
            # deklaruje ani jednej zależności sieciowej, a pilnuje tego jego własny test
            # `tests/test_granice.py` czytający manifest (krs-tool/docs/adr/0001, decyzja 2).
            sync_args: "--extra dev"
            # Układ płaski jak w `ceidg-tool`, stąd nazwy katalogów zamiast `.`.
            # `scripts` jest w zakresie od kroku 2 — tam stoi nakładka anonimizatora, czyli
            # ścieżka, którą powstaje materiał dowodowy dla `tests/fixtures/odpis_traits.yaml`.
            lint_paths: "krs_tool tests scripts"
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zainstaluj uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Czy TEN wpis macierzy ma co sprawdzać. Wpis `workmate` biegnie ZAWSZE i to jest
      # decyzja, nie niedopatrzenie: to on niesie bramki dokumentacji (martwe odsyłacze,
      # numeracja ADR, spójność wersji), które chodzą po CAŁYM drzewie. Zawężenie go po
      # katalogach wyłączyłoby strażnika dokładnie przy zmianie, której ten strażnik dotyczy —
      # a tę klasę repozytorium już raz zapłaciło (#166: bramka zapaliła się dopiero po scaleniu).
      - name: Zakres wpisu
        id: zakres
        if: ${{ !cancelled() }}
        env:
          WPIS: ${{ matrix.name }}
          ZMIENIONE: ${{ needs.zmiany.outputs.podprojekty }}
        run: |
          set -euo pipefail
          if [ "$WPIS" = "workmate" ] || [ "$ZMIENIONE" = "ALL" ] \
             || printf '%s' "$ZMIENIONE" | tr ' ' '\n' | grep -qx "$WPIS"; then
            echo "biegnie=true" >> "$GITHUB_OUTPUT"
            echo "Wpis $WPIS: biegnie."
          else
            echo "biegnie=false" >> "$GITHUB_OUTPUT"
            echo "Wpis $WPIS: zmiana go nie dotyczy, pomijam kroki bramki."
          fi

      - name: Synchronizacja zależności
        if: ${{ !cancelled() && steps.zakres.outputs.biegnie == 'true' }}
        run: uv sync ${{ matrix.sync_args }}

      # Bramki statyczne PRZED testami, a każda dodatkowo z `!cancelled()` — kolejność sama
      # nie wystarcza. Incydent z 2026-07-30 (komentarz wyżej): jeden czerwony test przykrył
      # lint, format, mypy i granice na tyle długo, że trzy pliki stały niezgodne z `ruff
      # format` przy „zielonym" CI. Krok, który padł, ma zabrać ze sobą TYLKO swoją informację,
      # a nie wynik wszystkich pozostałych. `!cancelled()` (nie `always()`) przerywa przy
      # anulowaniu przebiegu; przy padniętym `uv sync` wszystkie bramki zapalą się czerwono —
      # to świadomy koszt czytelności, bo pierwszą przyczynę widać w kroku synchronizacji.
      - name: Lint (ruff)
        if: ${{ !cancelled() && steps.zakres.outputs.biegnie == 'true' }}
        run: uv run ruff check ${{ matrix.lint_paths }}

      - name: Format (ruff)
        if: ${{ !cancelled() && steps.zakres.outputs.biegnie == 'true' }}
        run: uv run ruff format --check ${{ matrix.lint_paths }}

      - name: Typy (mypy)
        if: ${{ !cancelled() && steps.zakres.outputs.biegnie == 'true' }}
        run: uv run mypy

      # import-linter (pyproject.toml [tool.importlinter]) egzekwuje granice tylko rdzenia
      # workmate (core ↛ adapters, outbound ↛ inbound) — pod-projekty go nie mają.
      - name: Granice architektoniczne (import-linter)
        if: ${{ !cancelled() && matrix.name == 'workmate' }}
        run: uv run lint-imports

      - name: Testy
        if: ${{ !cancelled() && steps.zakres.outputs.biegnie == 'true' }}
        run: uv run pytest

  # Obraz pod-projektu budowany W BRAMCE, nie tylko na serwerze. Bez tego jobu `Dockerfile`
  # pod-projektu nie był budowany przez CI ANI RAZU — i przez to od czasu, gdy zestaw `tests/`
  # napisano na nowo po odzyskaniu źródeł 0.2.19, `docker build` kończył się `FileNotFoundError`,
  # a dokumentacja twierdziła, że „bramka jakości biegnie w trakcie budowania obrazu". Ścieżka
  # wdrożenia stała na zdaniu, którego nikt nie sprawdzał (naprawa: PR #109).
  #
  # Oba zadania budowy biegną na PR-ze TYLKO wtedy, gdy zmiana dotyka tego, co do obrazu
  # wchodzi. Powód jest zmierzony: etap `test` w obu Dockerfile'ach uruchamia TEN SAM pakiet
  # testów, który przed chwilą przeszedł we wpisie macierzy — 84 s i 83 s drugiego przebiegu
  # tej samej suity, czyli 38 % czasu zadań całego przebiegu. README mówi zresztą wprost, że
  # etap `test` „nie jest gwarancją", bo jego marker to pusty plik podmieniany z cache'u.
  # Na `Main`, nocą i ręcznie budują się ZAWSZE — tam pytanie brzmi „czy obraz w ogóle
  # powstaje", a bez tego bieg nocny przestałby rozbrajać bombę kalendarzową (#88).
  docker-build-powiadomienia:
    name: Budowa obrazu powiadomień
    runs-on: ubuntu-latest
    needs: zmiany
    if: ${{ needs.zmiany.outputs.obraz_powiadomien == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zbuduj obraz (etap `test` w Dockerfile jest bramką ścieżki wdrożeniowej)
        run: docker build -f Powiadomienia_teams/Dockerfile Powiadomienia_teams

  docker-build:
    name: Budowa obrazu floty
    runs-on: ubuntu-latest
    needs: zmiany
    if: ${{ needs.zmiany.outputs.obraz_floty == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zbuduj obraz (etap test wewnątrz Dockerfile pokrywa gałąź POSIX)
        run: docker build -f deploy/docker/Dockerfile .

  # Jeden autor w historii. Reguła istniała od przepisania historii 2026-09-10 wyłącznie jako
  # ZAPAMIĘTANA — czyli w tym samym stanie, w którym stała etykieta `revision` przed poprawką
  # opisaną w `[Unreleased]`: warunek pamiętany zamiast zapisanego. Ten job zamienia ją w bramkę.
  #
  # Bieg NOCNY jest tu warunkiem sensu, nie ozdobą. Commit scalający powstaje PO kontroli PR-a,
  # a merge przyciskiem GitHuba bierze autora z NAZWY PROFILU konta, ignorując `git config
  # user.name` — więc drift wchodzi dokładnie w chwili, której kontrola PR-a nie widzi. Złapie go
  # dopiero przebieg na `Main`: pierwszy push albo najbliższy bieg o 04:17 UTC.
  autorstwo:
    name: Jeden autor w historii
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Domyślny checkout jest PŁYTKI (jeden commit), więc `git log` widziałby jeden wiersz
          # i bramka przechodziłaby zawsze — najgorszy możliwy tryb awarii dla strażnika.
          fetch-depth: 0

      - name: Każdy commit ma autora P0w3r223
        env:
          OCZEKIWANY: "P0w3r223 <p0w3r2243@gmail.com>"
          # Puste poza zdarzeniem `pull_request` — na tym opiera się wybór zakresu niżej.
          BAZA: ${{ github.event.pull_request.base.sha }}
          GLOWA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Na `pull_request` checkout podstawia EFEMERYCZNY commit scalający, który tworzy sam
          # GitHub — jego autorem jest `GitHub <noreply@github.com>`. Bramka bez zawężenia zakresu
          # byłaby więc czerwona na KAŻDYM PR-ze, z powodu commita, którego nikt nie napisał
          # i który nigdzie nie wyląduje. Dlatego na PR-ze patrzymy na commity samej gałęzi.
          if [ -n "$BAZA" ]; then zakres="$BAZA..$GLOWA"; else zakres="HEAD"; fi
          obcy=$(git log --format='%H %an <%ae>' "$zakres" | grep -v "$OCZEKIWANY" || true)
          if [ -n "$obcy" ]; then
            echo "Commity z autorem innym niż $OCZEKIWANY:"
            echo "$obcy"
            echo
            echo "Merge przyciskiem GitHuba bierze autora z nazwy profilu konta."
            echo "Scal lokalnie (git merge --no-ff + push) albo zmień nazwę profilu."
            exit 1
          fi
          echo "Zakres $zakres: wszyscy autorzy to $OCZEKIWANY."

          # Pole COMMITTERA celowo nie jest sprawdzane: na 123 starszych merge'ach stoi tam
          # `GitHub <noreply@github.com>` i to opisuje prawdę — commit stworzyła maszyneria
          # przycisku, nie człowiek. Przedmiotem ujednolicenia był autor.

name: ceidg-tool (systemy i wersje Pythona)
# Ten plik pokrywa OŚ, której matryca `ci.yml` nie ma: drugi system i drugą wersję Pythona.
# Bramką jakości pod-projektu jest wpis `ceidg-tool` w matrycy `ci.yml` (ubuntu + uv) i to on
# jest warunkiem scalenia; tutaj zostaje wyłącznie to, czego tamten nie zobaczy. Ta oś nie jest
# ozdobą: #146 i #147 to były usterki widoczne WYŁĄCZNIE na Windows, obie przeżyły w repozytorium
# tygodnie zielonego CI i obie znalazł człowiek, nie bramka.
#
# Filtr `paths` zastąpił filtr gałęzi (`branches: [ceidg-tool]`), którym ten plik żył, dopóki
# pod-projekt stał poza `Main` (ADR 0074). Powód zawężenia się nie zmienił: matryca jest
# czterodrożna, więc bez filtra literówka w cudzym katalogu wydawałaby minuty Actions na cztery
# pełne przebiegi tej suity. Zmieniło się tylko to, po czym zawężamy — katalog zamiast gałęzi.
on:
  push:
    branches: [Main, Dev]
    paths:
      - 'ceidg-tool/**'
      - '.github/workflows/ceidg-tool.yml'
  pull_request:
    branches: [Main, Dev]
    paths:
      - 'ceidg-tool/**'
      - '.github/workflows/ceidg-tool.yml'
jobs:
  test:
    name: ceidg-tool (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ceidg-tool
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
    steps:
      # Pełna historia, nie sam wierzchołek. `ceidg-tool/tests/test_brak_poswiadczen.py`
      # skanuje bloby osiągalne z HEAD, bo publikuje się historię, a nie drzewo robocze:
      # token wpisany i skasowany następnym commitem zostaje w historii. Przy domyślnym
      # `fetch-depth: 1` ten skan widziałby jeden commit i **milczał** — więc test wywraca
      # się na płytkim klonie zamiast przechodzić, a ta linijka jest tym, co go zaspokaja.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Z LOCKA, nie z zakresów: §B `ceidg-tool/docs/reference/uzupelnienie-01.md` wymaga przypiętych zależności, a ta oś
      # jest jedyną, która biegnie na Windows i na drugiej wersji Pythona — czyli jedyną, która
      # łapie usterki niewidoczne na ubuntu (#146, #147). Instalacja rozwiązywana od nowa przy
      # każdym przebiegu znaczyła, że nie wiadomo, KTÓRY program ta bramka przed chwilą
      # sprawdziła. `httpx>=0.27,<0.29` ma w `pyproject.toml` napisane, że gwarancja wyjścia
      # z §B opiera się na WEWNĘTRZNYM zachowaniu biblioteki — przypięcie jest warunkiem, żeby
      # to zdanie cokolwiek znaczyło (#157).
      #
      # `requirements.lock` powstaje z `uv.lock` (`uv export`), więc obie drogi instalacji niosą
      # JEDNO rozwiązanie; pilnuje tego `tests/test_locki_zgodne.py`. Lock niesie też `dev`
      # i `asystent`, więc żaden krok niżej nic nie traci. `asystent` jest tu obowiązkowy mimo
      # że w produkcie jest opcjonalny: bez niego `tests/test_assistant_caller.py` nie zbierze
      # się (importuje `httpx2`), a skany granic 11 i 12 nie widzą prawdziwego grafu importów.
      - run: python -m pip install -r requirements.lock
      # `--no-deps`, bo zależności są już zainstalowane z locka — bez tego pip rozwiązałby je
      # drugi raz, z zakresów, i przypięcie przestałoby obowiązywać w tym samym kroku.
      - run: python -m pip install -e . --no-deps
      # Cały `scripts/` od kiedy sondy dzielą limiter z narzędziem (`scripts/probe_support.py`) —
      # wyliczanka plików gubiłaby każdy nowy. Dostarczony oryginał `ceidg_probe.py` leży
      # w katalogu głównym pod-projektu i celowo zostaje poza tym.
      - run: ruff check ceidg_tool tests scripts
      - run: ruff format --check ceidg_tool tests scripts
      - run: mypy ceidg_tool tests
      # §E `ceidg-tool/docs/reference/uzupelnienie-01.md`: scenariusze 4 i 7 przy każdym uruchomieniu (tests/resilience/)
      # Bez `-q`: `addopts = "-q"` jest w pyproject.toml, więc jawne dawało `-qq` — a przy tej
      # gadatliwości pytest nie drukuje linii podsumowania i log przebiegu nie mówił, ile testów
      # przeszło. Trzy wersje CLAUDE.md cytowały liczbę, której żadna bramka nie umiała wypisać.
      - run: python -m pytest -p no:warnings

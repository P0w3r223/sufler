# Reverse proxy Sufler — terminacja TLS + streaming SSE do serwera MCP (ADR 0044/0007).
# Montowany jako /etc/nginx/conf.d/sufler.conf. Podmień sufler.firma.pl na realny host.
#
# KLUCZOWE dla streamable-http: proxy_buffering off (inaczej klient MCP wisi na pierwszym żądaniu —
# odpowiednik responseBufferLimit=0 z web.config IIS). Host w proxy_set_header MUSI zgadzać się z
# SUFLER_ALLOWED_HOSTS w env, inaczej drzwi zwrócą 421 (ochrona przed DNS-rebinding).

upstream sufler_mcp {
    server mcp:8000;      # nazwa usługi z docker-compose (sieć wewnętrzna)
    keepalive 16;
}

# HTTP → wymuś HTTPS.
server {
    listen 80;
    server_name sufler.firma.pl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sufler.firma.pl;

    ssl_certificate     /etc/nginx/certs/sufler.crt;
    ssl_certificate_key /etc/nginx/certs/sufler.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Klient MCP potrafi przysłać większy pierwszy pakiet (lista narzędzi); nie tnij go.
    client_max_body_size 16m;

    location / {
        proxy_pass http://sufler_mcp;
        proxy_http_version 1.1;

        # Host MUSI trafić do SUFLER_ALLOWED_HOSTS (bez portu dla 443 + z :* — patrz env).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streamable-http: bez buforowania i z długim czasem życia strumienia zdarzeń.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;

        # Nagłówki utrzymania połączenia SSE.
        proxy_set_header Connection "";
    }
}

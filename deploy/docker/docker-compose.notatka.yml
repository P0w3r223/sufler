# Override: RW dostęp do notatek dla drzwi teams-graph (produkcyjny zapis /notatka, ADR 0041).
#
# Bazowy compose montuje ../../data:/app/data RO (secure-by-default, ADR 0007). Ścieżka /notatka
# (WORKMATE_TEAMS_GRAPH_ENABLE_MEETING_NOTE_WRITE=true) woła save_note → pisze do data/notes/, więc
# na RO padłaby w runtime na „Read-only file system". Ten override nakłada WĄSKI montaż RW TYLKO na
# data/notes — rejestr projektów (data/projects/registry.yaml) i reszta bazy wiedzy zostają RO.
# Least-privilege: zapisywalne jest wyłącznie to, co /notatka faktycznie tworzy (nowe pliki .md).
#
# Montaż jest ZAGNIEŻDŻONY i DOKŁADANY (nowy cel /app/data/notes, nie nadpisanie /app/data): Docker
# zakłada głębszy montaż na płytszym (kolejność po długości ścieżki docelowej), więc /app/data zostaje
# RO, a /app/data/notes nakłada się RW. Montaż stanu (events.db, MSAL) dziedziczy się z bazy bez zmian.
#
# Opt-in JAWNY — to NIE docker-compose.override.yml, nie ładuje się samo:
#   docker compose -f docker-compose.yml -f docker-compose.notatka.yml --profile bridge up -d
#
# Wymaga też w ./env (inaczej drzwi startują w trybie tylko-odczytu, a RW jest bez efektu):
#   WORKMATE_TEAMS_GRAPH_ENABLE_MEETING_NOTE_WRITE=true   (+ _ENABLE_MEETING_TRANSCRIPT, _IDENTITIES)

services:
  teams-graph:
    volumes:
      - ../../data/notes:/app/data/notes:rw

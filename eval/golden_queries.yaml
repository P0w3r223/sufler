# Złoty zbiór zapytań do mikro-evalu retrievalu notatek (ADR 0023 — BRAMKA Fazy B).
#
# STARTER do przeglądu przez pion: to punkt wyjścia zbudowany z treści realnych 15 notatek
# (+ 3 zapytania wykopane z historii search_notes: MCP, bramka, workmate). Dopisujcie realne
# zapytania użytkowników i korygujcie etykiety — im więcej i im trafniej, tym pewniejsza decyzja
# o włączeniu warstwy dense (Faza B).
#
# Każdy wpis: `query` (jak wpisałby pracownik pionu) + `relevant` (lista note_id, które MUSZĄ się
# znaleźć wysoko). Kolejność w `relevant` bez znaczenia. Wiele zapytań jest w formie FLEKSYJNEJ
# innej niż w notatce — to celowe (mierzymy zysk lematyzacji PL).


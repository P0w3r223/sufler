[project]
name = "claude-summary"
version = "0.1.0"
description = "Dzienne zestawienie pracy z historii promptów Claude Code i commitów (materiał dla agenta Jira)."
requires-python = ">=3.10"
dependencies = [
    "tzdata>=2024.1",
]

[project.scripts]
claude-summary = "claude_summary.app:main"

[project.optional-dependencies]
# Warstwa LLM — opcjonalny opis prozą per dzień (Claude API).
agent = [
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_summary"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# C901/PLR0915 jak w korzeniu repo — sufit funkcji egzekwowany maszynowo, nie pamiętany.
# Wyjątki są punktowe (`noqa` przy funkcji) i mają zniknąć razem z długiem, który opisują.
select = ["E", "F", "I", "UP", "B", "SIM", "C901", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

# ------------------------------------------------------- klasa II: zdanie bez użytecznego filtru
# Poprawnym wynikiem jest **ścieżka**, nie wartości pól: ADR-0017 każe wejść w rundę
# dopytania, a wejście zależy od `kryteria.is_empty()`, nie od tego, czy model zapytał.
# Zmyślenie tu filtra jest defektem, bo zapytanie wygląda wtedy na odpowiedziane.
niedookreslone:
  - id: N01
    zdanie: "wszystkie firmy"
  - id: N02
    zdanie: "chcę wszystko"
  - id: N03
    zdanie: "dane"

  # Przypadki przeciwne do poprawki z 2026-09-09. Zdjęcie województwa dopisywanego do miasta
  # nie ma prawa zabrać województwa, które operator **nazwał sam** — inaczej poprawka leczy
  # jedną cichą stratę, produkując drugą. Zestaw bez przypadków przeciwnych optymalizuje
  # w jedną stronę i tego nie widzi.
  - id: S16
    zdanie: "kluby fitness w województwie śląskim"
    wojewodztwo: [śląskie]
    pkd_nazwa: "fitness"


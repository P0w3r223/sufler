    zdanie: "pomocy"
  - id: N06
    zdanie: "nie wiem czego szukam"
  - id: N07
    zdanie: "daj mi coś"
  - id: N08
    zdanie: "asdf"
  - id: N09
    zdanie: "."
  - id: N10
    zdanie: "szukam firm"

# ------------------------------------------- klasa III: filtr, którego rejestr nie ma

# Zestaw ewaluacyjny asystenta — dane, nie kod.
#
# Wzorce PKD są **nazwami do wyszukania w słowniku**, nie kodami wpisanymi z pamięci.
# `CLAUDE.md` zabrania zapisywania danych referencyjnych z głowy, a kod PKD wpisany
# ręcznie przechodziłby każdą automatyczną kontrolę, będąc po cichu złym. Harness
# rozwiązuje wzorzec na zbiór kodów przez `assistant.pkd.load_pkd()` i odmawia startu,
# gdy wzorzec nie trafia w nic albo trafia w zbyt wiele.

# ---------------------------------------------------------------- klasa I: niezmienniczość
# Każde ziarno dostaje 5 przekształceń zachowujących znaczenie. Odpowiedź nie ma prawa
# się zmienić, więc przekształcenie nie potrzebuje własnego wzorca — asercją jest zgodność
# z ziarnem (testowanie metamorficzne).
ziarna:
  - id: S01
    zdanie: "salony fryzjerskie w Gnieźnie"
    miasto: [Gniezno]
    pkd_nazwa: "ryzjer"

  - id: S02
    zdanie: "gabinety kosmetyczne w Poznaniu"
    miasto: [Poznań]
    pkd_nazwa: "kosmetyczn"


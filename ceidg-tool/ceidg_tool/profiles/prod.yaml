# Profil API — środowisko PRODUKCYJNE.
# Używane wyłącznie po jawnej zgodzie użytkownika (config.resolve_environment).
# Wartości potwierdzone sondą na produkcji 2026-09-05 (docs/decisions.md).
base_url: "https://dane.biznes.gov.pl/api/ceidg/v3"

paging_mode: links
page_start: 0                 # sonda: page=0 i page=1 zwracają różne rekordy
send_page_on_first_request: false

default_limit: 25
max_limit_firmy: 25           # sonda: limit=50 -> 400 NIEPOPRAWNY_ROZMIAR_STRONY (zakres 1-25)
max_limit_zmiana: 500         # mini-sonda 2026-09-05: limit=500 zwraca 500 id
count_semantics: total

ids_batch_size: 5             # sonda: 5 id działa; 25 i 50 -> 400 NIEPOPRAWNA_ILOSC_IDENTYFIKATOROW
max_url_length: 4000
detail_mode: query

list_root_key: firmy
detail_root_key: firma
changes_root_key: identyfikatoryWpisow
reports_root_key: raporty
empty_result_statuses: [204]

list_param_suffix: ""
wojewodztwo_case: upper
pkd_format: compact
date_format: "%Y-%m-%d"

max_pages: 10000

rate:
  windows: [[48, 180], [960, 3600]]
  # 3,75 s, nie 3,6 s z dokumentacji. Oba okna wymuszają 180/48 = 3600/960 = 3,75 s, więc
  # 3,6 s nigdy nie było odstępem docelowym — pozwalało tylko puszczać żądania gęściej,
  # a potem nadrabiać dłuższym postojem. Pomiar (2026-09-06, 1500 żądań na sztucznym
  # zegarze): przy 3,6 s w oknie 180 s mieściło się **49** żądań, o jedno ponad nasz własny
  # limit 48 i o jedno poniżej limitu API (50). Przy 3,75 s szczyt to równe 48, a średnia
  # przepustowość spada o 0,16 % — bezpieczeństwo za darmo.
  min_spacing_s: 3.75
  cooldown_s: 185
  max_retries_5xx: 3
  backoff_base_s: 5
  timeout_s: 60

name: ci
# Filtr gałęzi, a nie jego brak, i to z dwóch różnych powodów.
#
# `push`: ta gałąź żyje w cudzym repozytorium (`PIWorkmate`, którego `Main` to nieznajomy
# produkt), a matryca niżej jest czterodrożna — dwa systemy razy dwie wersje Pythona. Bez
# filtra każdy push, także poprawka literówki w dokumencie, wydawał minuty Actions organizacji
# na cztery pełne przebiegi suity.
#
# `pull_request`: dziś nadmiarowy, bo GitHub bierze plik workflow z gałęzi **bazowej** PR-a,
# a ten plik istnieje tylko na `ceidg-tool` — czyli i tak odpalałby się wyłącznie dla PR-ów
# do niej. Filtr jest tu na wypadek, gdyby ta gałąź kiedyś trafiła do `Main`: bez niego plik
# zacząłby wtedy odpalać naszą matrycę przy każdym PR-ze cudzego zespołu, a to jest awaria,
# której nikt by z nami nie skojarzył.
on:
  push:
    branches: [ceidg-tool]
  pull_request:
    branches: [ceidg-tool]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # `asystent` obowiązkowo: bez niego `tests/test_assistant_caller.py` nie zbierze się
      # (importuje `httpx2`), a skany granic 11 i 12 nie widzą prawdziwego grafu importów —
      # nazwa `httpx2` w `HTTP_CLIENT_MODULES` byłaby wtedy założeniem, nie faktem.
      - run: python -m pip install -e .[dev,asystent]
      # Cały `scripts/` od kiedy sondy dzielą limiter z narzędziem (`scripts/probe_support.py`) —
      # wyliczanka plików gubiłaby każdy nowy. Dostarczony oryginał `ceidg_probe.py` leży
      # w katalogu głównym i celowo zostaje poza tym.
      - run: ruff check ceidg_tool tests scripts
      - run: ruff format --check ceidg_tool tests scripts
      - run: mypy ceidg_tool tests
      # UZUPELNIENIE_01 §E: scenariusze 4 i 7 przy każdym uruchomieniu (tests/resilience/)
      # Bez `-q`: `addopts = "-q"` jest w pyproject.toml, więc jawne dawało `-qq` — a przy tej
      # gadatliwości pytest nie drukuje linii podsumowania i log przebiegu nie mówił, ile testów
      # przeszło. Trzy wersje CLAUDE.md cytowały liczbę, której żadna bramka nie umiała wypisać.
      - run: python -m pytest -p no:warnings

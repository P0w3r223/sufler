[project]
name = "powiadomienia-teams"
version = "0.1.0"
description = "Cotygodniowe przypomnienia o uzupełnianiu zmian w Microsoft Shifts (Teams)."
requires-python = ">=3.10"
dependencies = [
    "msal>=1.37.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.scripts]
powiadomienia-teams = "powiadomienia_teams.app:main"

[project.optional-dependencies]
# Etap 4 — interpretacja odpowiedzi naturalnym językiem
agent = [
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/powiadomienia_teams"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["msal.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

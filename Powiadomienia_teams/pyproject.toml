[project]
name = "powiadomienia-teams"
version = "0.2.24"
description = "Cotygodniowe przypomnienia o uzupełnianiu zmian w Microsoft Shifts (Teams)."
requires-python = ">=3.10"
dependencies = [
    "msal>=1.37.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.scripts]
powiadomienia-teams = "powiadomienia_teams.app:main"

[project.optional-dependencies]
# Etap 4 — interpretacja odpowiedzi naturalnym językiem
agent = [
    # Przypięte dokładnie do wersji z obrazu 0.2.19 — patrz METADATA w /app/.venv.
    "anthropic==0.120.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/powiadomienia_teams"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# C901/PLR0915 jak w korzeniu repo — sufit funkcji egzekwowany maszynowo, nie pamiętany.
# Wyjątki są punktowe (`noqa` przy funkcji) i mają zniknąć razem z długiem, który opisują.
# `W` doszło 2026-09-11 przy wyrównywaniu zestawów między pod-projektami (#158): zero
# naruszeń we wszystkich trzech, więc kosztowało tyle, co wpisanie litery. `N` świadomie
# NIE wchodzi — 56 z 64 jego trafień to nazwy testów, w których WIELKA LITERA niesie słowo
# nośne (`test_obcy_nadawca_NIE_pozwala_wygasic_wpisu`), a osiem kolejnych kazałoby zmienić
# nazwy wyjątków w źródłach odzyskanych z obrazu 0.2.19. Reguła trafiałaby w konwencję,
# nie w dług — pomiar w #158.
select = ["E", "F", "I", "UP", "B", "SIM", "W", "C901", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.10"
# `strict` zamiast trzech flag z osobna. Zmierzone 2026-09-11 przed włączeniem: `mypy --strict`
# przechodzi tu BEZ ANI JEDNEGO błędu — czyli ten stan już obowiązywał, tylko nic go nie trzymało.
# `ceidg-tool` miał `strict` od początku i to była jedyna różnica w typowaniu między
# pod-projektami (#158). Trzy flagi niżej zawierają się w `strict`, więc znikają: dwa zapisy
# tej samej reguły rozjeżdżają się przy pierwszej zmianie jednego z nich.
strict = true
# `scripts` OBOWIĄZKOWO, nie tylko `src`. Skrypty diagnostyczne wchodzą do obrazu i sięgają po
# ten sam model domeny co usługa, a przy zasięgu ograniczonym do `src` literówka w nazwie pola
# (`shift.member_id` zamiast `user_id`) przechodziła przez WSZYSTKIE cztery bramki i wywracała się
# dopiero na żywym tenancie, w połowie pomiaru. `tests` zostają poza zasięgiem — tam atrapy bywają
# świadomie nietypowane, a `disallow_untyped_defs` zamieniłoby to w setki adnotacji bez wartości.
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = ["msal.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# `-rxX` wypisuje POWÓD każdego xfail i xpass. Bez tego `-q` pokazuje samo `x`, a te znaczniki
# niosą tu opisy zweryfikowanych usterek 0.2.19 — informację, dla której w ogóle istnieją.
# Liczy się zwłaszcza przy biegu nocnym: `xfail(strict=True)` zapala się CZERWONO dokładnie
# wtedy, gdy ktoś usterkę NAPRAWI i nie zdejmie znacznika. To zamierzone, ale bez powodu w logu
# wygląda o 6 rano jak regresja zamiast jak zaproszenie do skasowania jednej linijki.
# `s` dokłada powód POMINIĘCIA. Strażnicy prozy (`test_dokumentacja_bramek.py`) pomijają się
# w obrazie, bo ten nie niesie `README.md` — bez `-rs` byłoby to milczenie nieodróżnialne od biegu.
addopts = "-q -rxXs"

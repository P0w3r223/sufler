[project]
name = "powiadomienia-teams"
version = "0.2.19"
description = "Cotygodniowe przypomnienia o uzupełnianiu zmian w Microsoft Shifts (Teams)."
requires-python = ">=3.10"
dependencies = [
    "msal>=1.37.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.scripts]
powiadomienia-teams = "powiadomienia_teams.app:main"

[project.optional-dependencies]
# Etap 4 — interpretacja odpowiedzi naturalnym językiem
agent = [
    # Przypięte dokładnie do wersji z obrazu 0.2.19 — patrz METADATA w /app/.venv.
    "anthropic==0.120.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/powiadomienia_teams"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# C901/PLR0915 jak w korzeniu repo — sufit funkcji egzekwowany maszynowo, nie pamiętany.
# Wyjątki są punktowe (`noqa` przy funkcji) i mają zniknąć razem z długiem, który opisują.
select = ["E", "F", "I", "UP", "B", "SIM", "C901", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 15

# `src/` to artefakt ODZYSKANY z obrazu produkcyjnego 0.2.19 (commit importu 7c7fe8c), a nie kod
# pisany ręcznie w tym repo. Sufit funkcji (C901, PLR0915) i limit linii zaostrzono na linii
# repozytorium 2026-09-02 — czyli JUŻ PO buildzie 0.2.19 — więc ten kod nigdy nie miał szansy im
# sprostać. Naginanie go teraz kosztowałoby jedyną własność, dla której import w ogóle powstał:
# możliwość porównania repo z tym, co realnie pisze do ludzi i zapisuje grafik klienta.
#
# Wyciszone jest PIĘĆ reguł: E501 (długość linii), C901 i PLR0915 (sufit funkcji) oraz SIM105
# i SIM300 — dwie stylistyczne z rodziny SIM. F (błędy), B (pułapki), UP, I i RESZTA SIM zostają
# aktywne.
#
# `SIM105` (`contextlib.suppress` zamiast `try/except/pass`) wyciszamy z zastrzeżeniem: w kodzie,
# którego centralną klasą usterki są POŁKNIĘTE WYJĄTKI, nie jest to reguła czysto kosmetyczna.
# Jedyne jej wystąpienie (`runtime/przeglad.py`) dotyczy `OSError` przy odczycie pliku w raporcie
# diagnostycznym, czyli miejsca bez skutków ubocznych. Kształtu szwu wysyłki pilnuje osobno
# `tests/test_szew_wysylki.py`, i to tam mieszka realna bramka na połykanie.
#
# Dług znika razem z falami naprawczymi — od pierwszej z nich repo NIE jest już tożsame z obrazem,
# więc argument „wierność wobec artefaktu" wygasa i wyłączenia trzeba będzie zdjąć.
[tool.ruff.lint.per-file-ignores]
"src/**" = ["E501", "SIM105", "SIM300"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["msal.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# `-rxX` wypisuje POWÓD każdego xfail i xpass. Bez tego `-q` pokazuje samo `x`, a te znaczniki
# niosą tu opisy zweryfikowanych usterek 0.2.19 — informację, dla której w ogóle istnieją.
# Liczy się zwłaszcza przy biegu nocnym: `xfail(strict=True)` zapala się CZERWONO dokładnie
# wtedy, gdy ktoś usterkę NAPRAWI i nie zdejmie znacznika. To zamierzone, ale bez powodu w logu
# wygląda o 6 rano jak regresja zamiast jak zaproszenie do skasowania jednej linijki.
# `s` dokłada powód POMINIĘCIA. Strażnicy prozy (`test_dokumentacja_bramek.py`) pomijają się
# w obrazie, bo ten nie niesie `README.md` — bez `-rs` byłoby to milczenie nieodróżnialne od biegu.
addopts = "-q -rxXs"

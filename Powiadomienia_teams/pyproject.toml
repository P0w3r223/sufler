[project]
name = "powiadomienia-teams"
version = "0.2.19"
description = "Cotygodniowe przypomnienia o uzupełnianiu zmian w Microsoft Shifts (Teams)."
requires-python = ">=3.10"
dependencies = [
    "msal>=1.37.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.scripts]
powiadomienia-teams = "powiadomienia_teams.app:main"

[project.optional-dependencies]
# Etap 4 — interpretacja odpowiedzi naturalnym językiem
agent = [
    # Przypięte dokładnie do wersji z obrazu 0.2.19 — patrz METADATA w /app/.venv.
    "anthropic==0.120.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/powiadomienia_teams"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# C901/PLR0915 jak w korzeniu repo — sufit funkcji egzekwowany maszynowo, nie pamiętany.
# Wyjątki są punktowe (`noqa` przy funkcji) i mają zniknąć razem z długiem, który opisują.
select = ["E", "F", "I", "UP", "B", "SIM", "C901", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 15

# `src/` to artefakt ODZYSKANY z obrazu produkcyjnego 0.2.19 (commit importu 7c7fe8c), a nie kod
# pisany ręcznie w tym repo. Sufit funkcji (C901, PLR0915) i limit linii zaostrzono na linii
# repozytorium 2026-09-02 — czyli JUŻ PO buildzie 0.2.19 — więc ten kod nigdy nie miał szansy im
# sprostać. Naginanie go teraz kosztowałoby jedyną własność, dla której import w ogóle powstał:
# możliwość porównania repo z tym, co realnie pisze do ludzi i zapisuje grafik klienta.
#
# Wyciszone są WYŁĄCZNIE trzy reguły kosmetyczne. F (błędy), B (pułapki), SIM, UP, I zostają
# aktywne — one łapią usterki, a nie długość linii. Dług znika razem z odtworzeniem zestawu
# testowego: bez testów nie ma jak bezpiecznie przepisać 326-linijkowych funkcji.
[tool.ruff.lint.per-file-ignores]
"src/**" = ["E501", "C901", "PLR0915", "SIM105", "SIM300"]

# Formatowanie omija `src/` z tego samego powodu: `ruff format` jest wprawdzie zachowawczy
# semantycznie (sprawdzone — AST identyczne we wszystkich 48 plikach), ale przepisałby 41 plików,
# a wtedy „repo zgadza się z obrazem" przestałoby być prawdą dla drzewa roboczego.
[tool.ruff.format]
# `scripts/lista_czlonkow.py` również pochodzi z obrazu (kopiowany tam osobno przez Dockerfile),
# więc obejmuje go ta sama zasada co `src/`.
exclude = ["src/**", "scripts/lista_czlonkow.py"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["msal.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
